<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Ad B: twins</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@600&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="ad.css">
<style>
  h1 { font-size: 100px; margin-top: 44px; }
  .sub { font-size: 40px; margin-top: 22px; }
  .pairs { margin: 56px 0 0; padding: 14px 40px 12px; transform: rotate(-1deg); }
  .row { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; padding: 8px 0; border-bottom: 3px dashed rgba(22,20,15,.25); font-family: "JetBrains Mono"; }
  .us { font-size: 56px; font-weight: 700; color: #4a463d; text-decoration: line-through; text-decoration-color: #c8281f; text-decoration-thickness: 7px; }
  .ar { font-size: 50px; text-align: center; }
  .eu { font-size: 56px; font-weight: 700; color: #0c7448; }
  .cta { margin-top: 48px; }
  .fine { margin-top: 26px; }
  body.story .pairs { margin-top: 70px; padding: 22px 40px 16px; }
  body.story .row { padding: 16px 0; }
  body.story .cta { margin-top: auto; }
  .eu span { background: linear-gradient(transparent 52%, #ffe45c 52%); padding: 0 6px; }
  .blur { filter: blur(14px); }
  .more { font: 500 30px/1.2 "JetBrains Mono"; color: #4a463d; margin: 14px 0 6px; }
  .pairs .hand { right: -10px; top: -58px; transform: rotate(-5deg); }
  body.story h1 { font-size: 100px; }
  body.story .pairs { margin-bottom: 48px; }
</style></head>
<body>
  <div class="logo"><i>ETF</i><b>tahák</b></div>
  <h1>Broker vám nedovolil koupit <mark>VOO?</mark></h1>
  <p class="sub">Americká ETF drobný investor v EU nekoupí. <b style="color:#16140f">Jejich evropská dvojčata ano.</b></p>
  <div class="slip pairs">
    <span class="hand">stejný index!</span>
    <div class="row"><span class="us">VOO</span><span class="ar">→</span><span class="eu"><span>VUAA</span></span></div>
    <div class="row"><span class="us">SPY</span><span class="ar">→</span><span class="eu"><span>SPYL</span></span></div>
    <div class="row"><span class="us">VT</span><span class="ar">→</span><span class="eu"><span>VWCE</span></span></div>
    <div class="row"><span class="us">SCHD</span><span class="ar">→</span><span class="eu blur"><span>XXXX</span></span></div>
    <p class="more">+ 9 dalších párů s ISINy</p>
  </div>
  <div class="cta"><span>Stáhnout tahák zdarma</span><span>→</span></div>
  <p class="fine">Srovnání veřejných dat (Yahoo Finance, justETF). Nejde o investiční doporučení.</p>
<script>if (/f=story/.test(location.search)) document.body.className = "story";</script>
</body></html>
